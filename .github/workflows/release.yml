# Push a tag equal to the manifest version (e.g. 0.1.1) → build in CI, attest provenance, publish the release.
name: Release

on:
  push:
    tags: ['2.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Attest build provenance 
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
